<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        h1 { color: #1a365d; font-size: 28px; margin-bottom: 10px; }
        p { color: #718096; margin-bottom: 40px; }
        .tools { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .tool-card { background: white; border-radius: 16px; padding: 40px 30px; width: 280px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
        .tool-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .tool-icon { font-size: 48px; margin-bottom: 15px; }
        .tool-card h3 { color: #1a365d; font-size: 18px; margin-bottom: 8px; }
        .tool-card p { color: #718096; font-size: 14px; margin: 0; }
        .footer { margin-top: 60px; color: #a0aec0; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <h1>财务工具箱</h1>
    <p>张洪杰 · 专业财务工具集</p>
    <div class="tools">
        <a href="./index_real.html" class="tool-card">
            <div class="tool-icon">🔍</div>
            <h3>进项发票核查工具</h3>
            <p>开票前进项智能匹配核查</p>
        </a>
        <a href="./xiaoshou/" class="tool-card">
            <div class="tool-icon">📊</div>
            <h3>每日销售报表工具</h3>
            <p>销售数据一键生成报表</p>
        </a>
    </div>
    <div class="footer">© 2026 财务工具箱 · 开发者：张洪杰</div>
</body>
</html>
